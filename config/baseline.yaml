# Baseline training configuration
# Paths are workspace-relative

data_path: data/processed/master_dataset.csv

seed: 42

splits:
  train: 0.70
  val: 0.15
  test: 0.15

text:
  max_features: 20000
  ngram_range: [1, 2]
  min_df: 5
  max_df: 0.8

features:
  use_market_features: true
  use_sentiment: true

market:
  prices_dir: data/raw/prices
  timezone: America/New_York
  market_open: "09:30"
  market_close: "16:00"

model:
  max_iter: 2000
  class_weight: balanced
  penalties: ["l2"]
  c_values: [0.1, 0.3, 1.0]
  solver: saga

artifacts:
  model_path: artifacts/models/logreg_model.joblib
  vectorizer_path: artifacts/models/tfidf_vectorizer.joblib
  feature_meta_path: artifacts/models/feature_meta.joblib
  metrics_path: artifacts/reports/metrics.json
