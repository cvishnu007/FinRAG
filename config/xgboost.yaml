# XGBoost training configuration
# Paths are workspace-relative

data_path: data/processed/master_dataset.csv

seed: 42

splits:
  train: 0.70
  val: 0.15
  test: 0.15

text:
  max_features: 5000
  ngram_range: [1, 1]
  min_df: 20
  max_df: 0.5
  use_svd: true
  svd_components: 100

features:
  use_market_features: true
  use_sentiment: true

market:
  prices_dir: data/raw/prices
  timezone: America/New_York
  market_open: "09:30"
  market_close: "16:00"

xgboost:
  eval_metric: auc
  early_stopping_rounds: 20
  params_grid:
    - max_depth: 3
      min_child_weight: 100
      subsample: 0.7
      colsample_bytree: 0.8
      reg_alpha: 5.0
      reg_lambda: 10.0
      learning_rate: 0.05
      n_estimators: 500
      tree_method: hist
    - max_depth: 4
      min_child_weight: 200
      subsample: 0.6
      colsample_bytree: 0.7
      reg_alpha: 3.0
      reg_lambda: 8.0
      learning_rate: 0.03
      n_estimators: 600
      tree_method: hist

artifacts:
  model_path: artifacts/models/xgboost_model.joblib
  preprocessor_path: artifacts/models/xgboost_preprocessor.joblib
  metrics_path: artifacts/reports/metrics_xgboost.json
  compare_path: artifacts/reports/metrics_compare.json
